<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <title>Welcome Page</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Unleash</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse ms-auto" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="#">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/create}">Sign Up</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/users}">Students</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div>
    <p>All Courses</p>
    <h1>Add A Course</h1>
    <form method="POST" th:action="@{/admin-courses}" th:object="${newCourse}">
        <div>
            <label>Course Name: </label>
            <input type="text" th:field="*{name}"  />
        </div>
        <div>
            <label>Course Code: </label>
            <input type="text" th:field="*{code}"  />
        </div>
        <div>
            <button>Add Course</button>
        </div>
    </form>
    <br />
    <table class="table">
        <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">Code</th>
        </tr>
        </thead>
        <tbody th:each="course : ${courses}">
        <tr>
            <td>[[${course.id}]]</td>
            <td>[[${course.name}]]</td>
            <td>[[${course.code}]]</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
