<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <title>Welcome Page</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Unleash</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse ms-auto" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="#">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/create}">Sign Up</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/users}">Students</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin-courses}">Admin</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
    <div>
        <p>Student List</p>
        <br />
        <table class="table">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Full Name</th>
                <th scope="col">Level</th>
            </tr>
            </thead>
            <tbody th:each="user : ${users}">
                <tr>
                    <td>[[${user.id}]]</td>
                    <td>[[${user.fullName}]]</td>
                    <td>[[${user.level}]]</td>
                </tr>
            </tbody>
        </table>
    </div>
    <p><a th:href="@{/create}">Create your account here</a></p>
</body>
</html>
